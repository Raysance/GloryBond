[project]
name = "GloryBond"
version = "0.1.0"
description = "QQ Agent for Honor of Kings: Track Stats & Interactive Engagement."
readme = "deployment/README.md"
requires-python = ">=3.11, <4.0"
dependencies = [
    "markdown-it-py>=3,<5",
    "apscheduler>=3.11,<4",
    "cryptography>=45,<46",
    "httpx[socks]>=0.28.1,<1",
    "jieba>=0.42,<1",
    "matplotlib>=3.9,<4",
    "nb-cli>=1.4,<2",
    "nonebot-adapter-onebot>=2.4,<3",
    "nonebot-plugin-apscheduler>=0.5,<1",
    "nonebot2[fastapi,httpx,websockets]>=2.4,<3",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "opencv-python-headless>=4.10,<5",
    "openai>=1.66,<3",
    "pillow>=11,<12",
    "pycryptodome>=3.20,<4",
    "pypinyin>=0.55,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "python-dateutil>=2.9,<3",
    "python-dotenv>=1,<2",
    "python-toon>=0.1,<1",
    "PyYAML>=6,<7",
    "ratelimit>=2.2,<3",
    "redis>=5,<7",
    "requests[socks]>=2.31,<3",
    "schedule>=1.2,<2",
    "seaborn>=0.13,<1",
    "sqlglot>=30.20,<31",
    "twikit>=2.3.3,<3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
local-agent = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["hok*", "agent_runtime*", "agent_console*", "qq_agent*", "hok_research*"]
exclude = ["agent_runtime.build*", "hok.debug_tools*"]

[tool.setuptools.package-data]
agent_console = ["static/*.html", "static/*.css", "static/*.js"]
hok_research = ["tdr_schema.json", "directory_schema.json", "resource_catalog.json", "gameplay_catalog.json"]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugin_dirs = ["hok"]
builtin_plugins = []
plugins = ["nonebot_plugin_apscheduler"]
