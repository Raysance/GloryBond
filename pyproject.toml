[project]
name = "GloryBond"
version = "0.1.0"
description = "QQ Agent for Honor of Kings: Track Stats & Interactive Engagement."
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "markdown-it-py>=3,<5",
    "matplotlib>=3.9,<4",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "seaborn>=0.13,<1",
    "sqlglot>=30.20,<31",
    "httpx[socks]>=0.28.1,<1",
    "requests[socks]>=2.31,<3",
    "cryptography>=45,<46",
    "jieba>=0.42,<1",
    "openai>=1.66,<3",
    "pillow>=11,<12",
    "pypinyin>=0.55,<1",
    "psycopg[binary]>=3.2,<4",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugin_dirs = ["hok"]
builtin_plugins = []
plugins = ["nonebot_plugin_apscheduler"]
