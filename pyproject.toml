[project]
name = "GloryBond"
version = "0.1.0"
description = "QQ Agent for Honor of Kings: Track Stats & Interactive Engagement."
readme = "README.md"
requires-python = ">=3.9, <4.0"
dependencies = [
    "cryptography>=45,<46",
    "pillow>=11,<12",
    "pypinyin>=0.55,<1",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugin_dirs = ["hok"]
builtin_plugins = []
plugins = ["nonebot_plugin_apscheduler"]
