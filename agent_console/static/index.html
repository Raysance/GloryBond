<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent Studio · Local</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Agent Studio 首页"
        ><span class="brand-icon">a</span><span>agent studio</span></a
      >
      <button id="new-session" class="new-session">
        <span>＋</span> 新建会话 <kbd>⌘ K</kbd>
      </button>
      <button class="nav-item" id="tools-nav">
        <span>◇</span> 工具
        <span class="nav-count" id="tool-count">—</span>
      </button>
      <div class="nav-label history-label">最近会话</div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-bottom">
        <div class="connection-dot"></div>
        <span id="connection-caption">连接中</span>
      </div>
    </aside>
    <main>
      <header class="topbar">
        <div class="session-heading">
          <span id="session-title">新会话</span>
        </div>
        <div class="topbar-actions">
          <button
            id="roleplay-toggle"
            class="roleplay-button"
            aria-label="选择角色与回复偏好"
          >
            <span id="identity-name">—</span
            ><span class="role-separator">/</span
            ><span id="role-name">角色</span><span>⌄</span>
          </button>
          <button id="trace-toggle" class="trace-button">
            <span>☷</span> 执行轨迹
          </button>
        </div>
      </header>
      <div id="chat-scroll" class="chat-scroll">
        <section id="welcome" class="welcome">
          <h1>想聊点什么？</h1>
          <div class="suggestions">
            <button
              data-prompt="查看群聊归档的覆盖时间，并统计各群已保存的消息数量。"
            >
              群聊记录</button
            ><button
              data-prompt="统计本赛季已记录玩家的正式对局场次和平均评分，注明样本量。"
            >
              王者数据</button
            ><button
              data-prompt="帮我联网搜索今天的王者荣耀官方更新消息，附上来源链接。"
            >
              联网搜索
            </button>
          </div>
        </section>
        <div id="messages" class="messages" aria-live="polite"></div>
      </div>
      <div class="composer-area">
        <form id="composer" class="composer">
          <div id="image-attachments" class="image-attachments" hidden></div>
          <input
            id="image-input"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
            multiple
            hidden
          />
          <textarea
            id="message-input"
            rows="2"
            placeholder="输入消息…"
            aria-label="聊天消息"
          ></textarea>
          <div class="composer-bottom">
            <div class="composer-controls">
              <button
                id="attach-images"
                type="button"
                class="attach-button"
                disabled
                aria-label="添加图片，也可粘贴或拖入"
              >
                ＋ 图片
              </button>
              <div class="model-select">
                <span class="model-dot"></span
                ><span id="model-name">DeepSeek</span
                ><span class="thinking-tag" id="thinking-tag">思考</span>
              </div>
            </div>
            <button id="send-button" type="submit" aria-label="发送消息">
              ↑</button
            ><button id="stop-button" type="button" hidden>■ 停止</button>
          </div>
        </form>
        <div class="composer-meta">
          <span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
          <div id="session-usage" aria-live="polite"></div>
        </div>
        <div id="error-banner" role="alert" hidden></div>
      </div>
    </main>
    <aside id="trace-panel" class="trace-panel" hidden>
      <div class="panel-header">
        <div><strong>执行轨迹</strong></div>
        <button id="trace-close" aria-label="关闭轨迹">×</button>
      </div>
      <div class="trace-tabs">
        <button data-tab="timeline" class="selected">时间线</button
        ><button data-tab="detail">详情</button>
      </div>
      <div id="trace-summary" class="trace-summary">等待执行</div>
      <div id="timeline" class="timeline"></div>
      <div id="trace-detail" class="trace-detail" hidden>
        <p class="detail-hint">选择步骤查看详情</p>
      </div>
    </aside>
    <dialog id="tools-dialog">
      <div class="dialog-header">
        <div>
          <h2>工具</h2>
        </div>
        <button id="tools-close" aria-label="关闭能力窗口">×</button>
      </div>
      <div id="connections" class="connections"></div>
      <div id="tools-list" class="tools-list"></div>
    </dialog>
    <dialog id="roleplay-dialog">
      <div class="dialog-header">
        <div>
          <h2>角色与回复偏好</h2>
          <p id="roleplay-owner">按用户保存，新建会话也沿用。</p>
        </div>
        <button id="roleplay-close" aria-label="关闭角色窗口">×</button>
      </div>
      <div id="role-options" class="role-options"></div>
      <div id="role-profile" class="role-profile"></div>
      <form id="preferences-form" class="preferences-form">
        <label
          >回复长度<select id="reply-length">
            <option value="concise">简短</option>
            <option value="standard">适中</option>
            <option value="detailed">详细</option>
          </select></label
        >
        <label
          >希望如何称呼你<input
            id="reply-address"
            maxlength="80"
            placeholder="默认使用配置昵称"
        /></label>
        <label class="full-width"
          >表达偏好<textarea
            id="reply-style"
            maxlength="1000"
            rows="2"
            placeholder="例如：少用表情、先给结论、保留适度吐槽"
          ></textarea>
        </label>
        <button type="submit" class="role-save">保存偏好</button
        ><span id="role-save-status" role="status"></span>
      </form>
      <form id="add-role-form" class="add-role-form">
        <h3>联网添加角色</h3>
        <div class="add-role-fields">
          <input
            id="add-role-character"
            aria-label="角色名称"
            placeholder="角色名称"
            maxlength="120"
            required
          /><input
            id="add-role-work"
            aria-label="所属作品"
            placeholder="所属作品（建议填写）"
            maxlength="120"
          /><button type="submit" class="role-save">添加并选用</button>
        </div>
      </form>
    </dialog>
    <script src="/static/usage.js" defer></script>
    <script src="/static/app.js" defer></script>
  </body>
</html>
