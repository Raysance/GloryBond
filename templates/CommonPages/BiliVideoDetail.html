<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ video.title }}</title>
  <style>
{% include "CommonPages/ios_glass_theme.css" %}
    :root {
      --page-bg: #f6f8fb;
      --surface: rgba(255, 255, 255, 0.78);
      --surface-solid: #ffffff;
      --line: rgba(57, 66, 82, 0.12);
      --text: #1f2937;
      --muted: rgba(31, 41, 55, 0.62);
      --pink: #fb7299;
      --blue: #2f9fdc;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--page-bg);
    }

    body.ios-glass-page {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(238, 243, 248, 0.96) 54%, #edf2f7 100%) !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }

    .summary-card {
      position: fixed;
      top: 14px;
      left: 50%;
      z-index: 100;
      width: min(560px, calc(100vw - 200px));
      min-width: 300px;
      padding: 11px 12px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.56)),
        var(--surface);
      box-shadow:
        0 14px 34px rgba(42, 50, 63, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.92);
      transform: translateX(-50%);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
    }

    .summary-title,
    .summary-up {
      display: block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0;
    }

    .summary-title {
      color: rgba(31, 41, 55, 0.94);
      font-size: 15px;
      font-weight: 820;
    }

    .summary-up {
      margin-top: 1px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
    }

    .top-actions {
      position: fixed;
      top: 14px;
      right: max(14px, calc((100vw - 760px) / 2));
      z-index: 101;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button {
      position: relative;
      display: inline-grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(249, 251, 253, 0.74));
      color: rgba(31, 41, 55, 0.82);
      box-shadow:
        0 7px 18px rgba(42, 50, 63, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.90);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      color: var(--blue);
      border-color: rgba(47, 159, 220, 0.30);
      box-shadow:
        0 10px 22px rgba(47, 159, 220, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.94);
      transform: translateY(-1px);
      outline: none;
    }

    .icon-button.app {
      color: var(--pink);
    }

    .icon-button.app:hover,
    .icon-button.app:focus-visible {
      border-color: rgba(251, 114, 153, 0.36);
      box-shadow:
        0 10px 22px rgba(251, 114, 153, 0.14),
        inset 0 1px 0 rgba(255, 255, 255, 0.94);
    }

    .shell {
      width: min(760px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 92px 0 30px;
    }

    .content-card {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 8px;
      background: var(--surface-solid);
      box-shadow:
        0 18px 44px rgba(42, 50, 63, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.86);
    }

    .cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(251, 114, 153, 0.12), rgba(47, 159, 220, 0.12));
    }

    .cover img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-empty {
      display: grid;
      width: 100%;
      height: 100%;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 760;
      background:
        linear-gradient(135deg, rgba(251, 114, 153, 0.16), rgba(47, 159, 220, 0.15)),
        linear-gradient(180deg, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0));
    }

    .info-panel {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid rgba(57, 66, 82, 0.08);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(250, 252, 254, 0.94));
    }

    .info-row {
      display: flex;
      min-height: 40px;
      align-items: center;
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid rgba(57, 66, 82, 0.08);
      border-radius: 8px;
      background: rgba(246, 248, 251, 0.82);
      color: rgba(31, 41, 55, 0.86);
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0;
    }

    .info-row span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-row.vid {
      color: rgba(47, 159, 220, 0.96);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      font-weight: 800;
    }

    @media (max-width: 860px) {
      .summary-card {
        top: 10px;
        width: min(100vw - 28px, 560px);
        min-width: 0;
      }

      .top-actions {
        top: 70px;
        left: 50%;
        right: auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: min(100vw - 28px, 560px);
        transform: translateX(-50%);
      }

      .icon-button {
        width: 100%;
        height: 40px;
      }

      .shell {
        padding-top: 128px;
      }

      .info-panel {
        padding: 10px;
      }
    }
  </style>
</head>
<body class="ios-glass-page">
  <header class="summary-card">
    <span class="summary-title">{{ video.title }}</span>
    <span class="summary-up">{{ video.up_name }}</span>
  </header>

  <nav class="top-actions" aria-label="视频操作">
    {% if video.up_url %}
    <a class="icon-button" href="{{ video.up_url }}" target="_blank" rel="noopener noreferrer" aria-label="up主页" title="up主页">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="7.4" r="3.2"></circle>
        <path d="M5.7 19.2c.8-3.8 3-5.7 6.3-5.7 2.1 0 3.8.8 5 2.3"></path>
        <path d="M16.3 18.1h4.2"></path>
        <path d="M18.4 16v4.2"></path>
      </svg>
    </a>
    {% endif %}
    <a class="icon-button" href="{{ video.mobile_url }}" target="_blank" rel="noopener noreferrer" aria-label="视频链接" title="视频链接">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="6.2" width="16" height="11.6" rx="2.2"></rect>
        <path d="M10.1 9.6v4.8l4.4-2.4-4.4-2.4z"></path>
        <path d="M8.3 4.2 10 6.2"></path>
        <path d="M15.7 4.2 14 6.2"></path>
      </svg>
    </a>
    <a class="icon-button app" href="{{ video.yyb_url }}" target="_blank" rel="noopener noreferrer" aria-label="app跳转" title="app跳转">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="3.4" width="8" height="17.2" rx="2.1"></rect>
        <path d="M10.6 6.2h2.8"></path>
        <path d="M11.2 17.6h1.6"></path>
        <path d="M16.7 9.1 20 12l-3.3 2.9"></path>
        <path d="M19.6 12h-6.5"></path>
      </svg>
    </a>
  </nav>

  <main class="shell">
    <section class="content-card" aria-label="视频信息">
      <div class="cover">
        {% if video.pic %}
        <img src="{{ video.pic }}" alt="{{ video.title }}">
        {% else %}
        <div class="cover-empty">暂无缩略图</div>
        {% endif %}
      </div>

      <div class="info-panel">
        <div class="info-row vid">
          <span>{{ video.bvid }}</span>
        </div>
        <div class="info-row">
          <span>{{ video.pubdate_text or video.pubdate or "未知发布时间" }}</span>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
