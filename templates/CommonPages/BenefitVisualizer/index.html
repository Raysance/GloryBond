<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>受益受害贝叶斯收缩明细</title>
  <style>
{% include "CommonPages/BenefitVisualizer/styles.css" %}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">HOK_QQBot</p>
        <h1>受益受害贝叶斯收缩明细</h1>
        <p id="subtitle" class="subtitle">正在加载计算数据</p>
      </div>
      <div class="formula-card">
        <span>排序指标</span>
        <strong id="formula">posterior_avg_grade² / exp(posterior_win_rate)</strong>
      </div>
    </section>
    <section class="summary-grid">
      <article>
        <span>近期窗口</span>
        <strong id="recent-window">-</strong>
      </article>
      <article>
        <span>历史先验窗口</span>
        <strong id="prior-window">-</strong>
      </article>
      <article>
        <span>先验强度</span>
        <strong id="prior-strength">-</strong>
      </article>
      <article>
        <span>玩家数量</span>
        <strong id="row-count">-</strong>
      </article>
    </section>
    <section class="toolbar">
      <input id="search" type="search" placeholder="搜索玩家或昵称">
      <select id="sort">
        <option value="posterior_metric">按受益受害值升序</option>
        <option value="metric_delta">按收缩变化升序</option>
        <option value="recent_count">按近期场次降序</option>
        <option value="prior_weight">按先验权重降序</option>
      </select>
      <button id="replay" type="button">重播收缩动画</button>
    </section>
    <section class="visual-layout">
      <article class="chart-panel">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Shrinkage Map</p>
            <h2>近期表现 → 贝叶斯后验</h2>
          </div>
          <div class="legend">
            <span><i class="dot recent"></i>近期</span>
            <span><i class="dot posterior"></i>后验</span>
            <span><i class="line"></i>收缩方向</span>
          </div>
        </div>
        <svg id="chart" viewBox="0 0 1000 560" role="img" aria-label="受益受害收缩动态图"></svg>
        <div id="tooltip" class="tooltip" hidden></div>
      </article>
      <aside class="ranking-panel">
        <div class="panel-head compact">
          <div>
            <p class="eyebrow">Players</p>
            <h2>动态图例排行</h2>
          </div>
        </div>
        <div id="cards" class="cards"></div>
      </aside>
    </section>
    <section id="empty" class="empty" hidden>没有可展示的数据</section>
  </main>
  <script>
    window.BENEFIT_DATA_URL = "{{filename}}";
  </script>
  <script>
{% include "CommonPages/BenefitVisualizer/app.js" %}
  </script>
</body>
</html>
