    <!DOCTYPE html>
    <html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>单人详情-示例玩家52守卫🤖</title>
        <!-- <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script> -->
        <style>
            :root {
                --primary-color: #6c9bd1;
                --secondary-color: #4fc3f7;
                --dark-color: #2c3e50;
                --light-color: #f8f9fa;
                --success-color: #28a745;
                --danger-color: #dc3545;
                --accent-color: #6c757d;
            }
            
            body {
                font-family: 'Microsoft YaHei', sans-serif;
                background-color: #f8f9fa;
                color: #333;
                margin: 0;
                padding: 0;
                line-height: 1.6;
            }
            
            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }
            
            header {
                background: linear-gradient(135deg, rgba(108, 155, 209, 0.1), rgba(79, 195, 247, 0.1));
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                color: var(--dark-color);
                padding: 20px 0;
                text-align: center;
                border-radius: 15px;
                margin-bottom: 30px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            }
            
            h1 {
                margin: 0;
                font-size: 2.5rem;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            }

            /* 地图筛选按钮栏样式 */
            .map-filter-bar {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-bottom: 20px;
                padding: 10px 0;
            }
            .map-filter-btn {
                background: rgba(255, 255, 255, 0.7);
                color: var(--dark-color);
                border: 1px solid rgba(108, 155, 209, 0.2);
                border-radius: 8px;
                padding: 8px 16px;
                font-size: 0.9rem;
                cursor: pointer;
                transition: all 0.3s ease;
                backdrop-filter: blur(10px);
            }
            .map-filter-btn.active,
            .map-filter-btn:hover {
                background: rgba(108, 155, 209, 0.15);
                color: var(--primary-color);
                border: 1px solid rgba(108, 155, 209, 0.4);
                transform: translateY(-1px);
            }
            
            .dashboard {
                /* display: grid; */
                display: none;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
                margin-bottom: 30px;
            }
            
            .card {
                background-color: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 15px;
                padding: 20px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            
            .card:hover {
                transform: translateY(-5px);
                box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            }
            
            .card-header {
                display: flex;
                align-items: center;
                margin-bottom: 15px;
                padding-bottom: 10px;
                border-bottom: 1px solid #eee;
            }
            
            .card-icon {
                width: 40px;
                height: 40px;
                background-color: var(--secondary-color);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-right: 15px;
                color: white;
                font-size: 20px;
            }
            
            .card-title {
                margin: 0;
                font-size: 1.2rem;
                color: var(--dark-color);
            }
            
            .card-value {
                font-size: 2rem;
                font-weight: bold;
                margin: 10px 0;
                color: var(--primary-color);
            }
            
            .card-description {
                color: #666;
                font-size: 0.9rem;
            }
            
            .chart-container {
                background-color: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                border-radius: 15px;
                padding: 20px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                margin-bottom: 30px;
                height: 400px;
            }
            
            .battle-list h3 {
                margin-bottom: 10px;
                color: var(--dark-color);
                font-size: 1.1rem;
            }
            
            .battle-item {
                display: flex;
                align-items: flex-start;
                padding: 12px 16px;
                margin-bottom: 8px;
                border: none;
                border-radius: 12px;
                backdrop-filter: blur(10px);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
                transition: all 0.3s ease;
                position: relative;
            }

            .favorite-btn {
                position: absolute;
                top: 12px;
                right: 12px;
                width: 32px;
                height: 32px;
                border: none;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.8);
                color: #ccc;
                font-size: 14px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                backdrop-filter: blur(10px);
                z-index: 10;
            }

            .favorite-btn:hover {
                background: rgba(255, 255, 255, 0.95);
                color: #ff6b6b;
                transform: scale(1.1);
            }

            .favorite-btn.liked {
                color: #ff6b6b;
                background: rgba(255, 107, 107, 0.1);
            }

            .favorite-btn.loading {
                pointer-events: none;
                opacity: 0.6;
            }
            
            .battle-item.win-bg {
                background: linear-gradient(to right, transparent 0%, transparent 50%, rgba(40, 167, 69, 0.4) 100%);
            }
            
            .battle-item.lose-bg {
                background: linear-gradient(to right, transparent 0%, transparent 50%, rgba(220, 53, 69, 0.4) 100%);
            }
            
            .battle-item:hover {
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
                transform: translateY(-2px);
                cursor: pointer;
                background-color: rgba(255, 255, 255, 0.1);
            }
            
            .battle-item:last-child {
                margin-bottom: 0;
            }
            
            .hero-icon {
                width: 45px;
                height: 45px;
                border-radius: 50%;
                margin-right: 10px;
                object-fit: cover;
                border: 2px solid var(--light-color);
                flex-shrink: 0;
            }
            
            .battle-info {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            
            .battle-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 6px;
            }
            
            .battle-title {
                display: block;
                align-items: center;
                gap: 1px;
                flex: 1;
            }
            
            .battle-badges {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            
            .battle-meta {
                display: flex;
                justify-content: space-between;
                gap: 4px;
                margin: 2px 0;
                font-size: 0.8rem;
            }
            
            .battle-time {
                display: flex;
                flex-direction: column;
                gap: 1px;
                color: #666;
            }
            
            .game-type-info {
                display: flex;
                flex-direction: column;
                gap: 1px;
                text-align: right;
            }
            
            .footer {
                text-align: center;
                padding: 20px;
                /* color: #6c757d; */
                font-size: 14px;
                border-top: 1px solid #e9ecef;
                margin-top: 40px;
            }
            .rank-info {
                color: var(--primary-color);
                font-weight: bold;
                font-size: 0.9rem;
            }
            
            .rank-label {
                font-size: 0.7rem;
                color: #999;
                font-weight: normal;
            }
            
            .rank-value {
                font-weight: 600;
                color: var(--primary-color);
                font-size: 0.8rem;
            }
            
            .score-increase {
                color: var(--success-color);
                font-weight: bold;
            }
            
            .score-decrease {
                color: var(--danger-color);
                font-weight: bold;
            }
            
            .special-kills {
                color: var(--accent-color);
                font-weight: bold;
                background: rgba(108, 117, 125, 0.1);
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 0.8rem;
            }
            

            
            @media (max-width: 768px) {
                .battle-item {
                    padding: 6px 8px;
                    padding-right: 48px; /* 为收藏按钮留出空间 */
                }
                
                .hero-icon {
                    width: 40px;
                    height: 40px;
                    margin-right: 8px;
                }
                
                .battle-info {
                    gap: 1px;
                }
                
                .battle-meta {
                    flex-direction: column;
                    gap: 1px;
                    margin: 0;
                }
                
                .battle-header {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 2px;
                }
                
                .battle-badges {
                    align-self: flex-end;
                }
                
                .stats {
                    gap: 4px;
                    padding: 2px 0;
                }
                
                .kda-stat .stat-value {
                    font-size: 0.95rem;
                }
                
                .grade-stat .stat-value {
                    font-size: 0.95rem;
                }
                
                .game-type-info {
                    text-align: left;
                }

                .favorite-btn {
                    width: 28px;
                    height: 28px;
                    font-size: 12px;
                    top: 8px;
                    right: 8px;
                }
            }
            
            .battle-result {
                font-weight: bold;
                font-size: 0.8rem;
                padding: 2px 8px;
                border-radius: 10px;
                text-align: center;
                min-width: 40px;
            }
            
            .win {
                color: var(--success-color);
                background: linear-gradient(to right, rgba(40, 167, 69, 0.1), rgba(40, 167, 69, 0.3));
                border: 1px solid rgba(40, 167, 69, 0.3);
            }
            
            .lose {
                color: var(--danger-color);
                background: linear-gradient(to right, rgba(220, 53, 69, 0.1), rgba(220, 53, 69, 0.3));
                border: 1px solid rgba(220, 53, 69, 0.3);
            }
            
            .mvp-badge {
                gap: 4px;
                padding: 2px 0;

                color: var(--accent-color);
                font-weight: bold;
                background: rgba(108, 117, 125, 0.1);
                padding: 2px 6px;
                border-radius: 4px;
                font-size: 0.8rem;
            }
            
            .stats {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 4px 0;
                border-top: 1px solid #f0f0f0;
                font-size: 0.8rem;
            }
            
            .stat {
                display: flex;
                align-items: center;
                gap: 2px;
            }
            
            .stat-label {
                font-size: 0.75rem;
                color: #999;
            }
            
            .stat-value {
                font-weight: bold;
                color: var(--dark-color);
            }
            
            .kda-stat .stat-value {
                font-size: 1rem;
                font-weight: bold;
                color: var(--primary-color);
            }
            
            .grade-stat .stat-value {
                font-size: 1rem;
                font-weight: bold;
                color: var(--success-color);
            }
            
            .hidden-message {
                text-align: center;
                padding: 50px;
                color: #666;
                font-size: 1.2rem;
            }
            
            .player-profile {
                display: flex;
                align-items: center;
                margin-bottom: 20px;
                padding: 24px;
                border-radius: 15px;
                background: rgba(255, 255, 255, 0.8);
                backdrop-filter: blur(15px);
                border: 1px solid rgba(255, 255, 255, 0.2);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                color: var(--dark-color);
            }

            /* 调整子元素文字颜色 */
            .player-profile .player-name,
            .player-profile .player-title {
                color: var(--dark-color);
                text-shadow: none;
            }

            /* 可选：微调头像边框颜色 */
            .player-avatar {
                border: 3px solid rgba(108, 155, 209, 0.3); 
                /* 原为 var(--secondary-color) */
            }
            
            .player-info {
                text-align: center;
                flex: 1;
            }
            
            .player-name {
                text-align: center;
                margin: 0;
                font-size: 1.5rem;
                color: var(--dark-color);
            }
            
            .player-title {
                text-align: center;
                display: inline-block;
                background-color: rgba(108, 155, 209, 0.15);
                color: var(--primary-color);
                border: 1px solid rgba(108, 155, 209, 0.3);
                padding: 4px 12px;
                border-radius: 8px;
                font-size: 0.9rem;
                margin-top: 5px;
                font-weight: 500;
            }
            
            .player-stats {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
                margin-top: 10px;
            }
            
            .player-stat {
                text-align: center;
            }
            
            .stat-value {
                font-weight: bold;
                color: var(--primary-color);
            }
            
            .stat-label {
                font-size: 0.8rem;
                color: #666;
            }
            
            .error-message {
                background-color: #ffebee;
                color: #c62828;
                padding: 20px;
                border-radius: 10px;
                margin: 20px 0;
                text-align: center;
                border-left: 4px solid #c62828;
            }
            
            .loading-message {
                text-align: center;
                padding: 50px;
                color: #666;
                font-size: 1.2rem;
            }
            
            @media (max-width: 768px) {
                .dashboard {
                    grid-template-columns: 1fr;
                }
                
                .player-stats {
                    grid-template-columns: 1fr 1fr;
                }
                .map-filter-bar {
                    flex-direction: column;
                    gap: 6px;
                }
            }

            /* 新功能提示对话框样式 */
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.6);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                opacity: 0;
                visibility: hidden;
                transition: all 0.3s ease;
                backdrop-filter: blur(5px);
            }

            .modal-overlay.show {
                opacity: 1;
                visibility: visible;
            }

            .modal-content {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.3);
                border-radius: 20px;
                padding: 0;
                max-width: 480px;
                width: 90%;
                max-height: 90vh;
                overflow-y: auto;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
                transform: scale(0.7) translateY(50px);
                transition: all 0.3s ease;
            }

            .modal-overlay.show .modal-content {
                transform: scale(1) translateY(0);
            }

            .modal-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 20px 25px 15px;
                border-bottom: 1px solid rgba(108, 155, 209, 0.2);
            }

            .modal-header h3 {
                margin: 0;
                color: var(--dark-color);
                font-size: 1.4rem;
                font-weight: 600;
            }

            .modal-close {
                background: none;
                border: none;
                font-size: 24px;
                color: #666;
                cursor: pointer;
                width: 30px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                transition: all 0.2s ease;
            }

            .modal-close:hover {
                background-color: rgba(108, 155, 209, 0.1);
                color: var(--primary-color);
            }

            .modal-body {
                padding: 25px;
                text-align: center;
            }

            .tip-icon {
                font-size: 3rem;
                margin-bottom: 15px;
                animation: bounce 2s infinite;
            }

            @keyframes bounce {
                0%, 20%, 50%, 80%, 100% {
                    transform: translateY(0);
                }
                40% {
                    transform: translateY(-10px);
                }
                60% {
                    transform: translateY(-5px);
                }
            }

            .modal-body p {
                color: var(--dark-color);
                font-size: 1.1rem;
                line-height: 1.6;
                margin-bottom: 20px;
            }

            .tip-features {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-bottom: 20px;
            }

            .tip-item {
                display: flex;
                align-items: center;
                justify-content: flex-start;
                padding: 12px 16px;
                background: rgba(108, 155, 209, 0.08);
                border: 1px solid rgba(108, 155, 209, 0.15);
                border-radius: 10px;
                transition: all 0.2s ease;
            }

            .tip-item:hover {
                background: rgba(108, 155, 209, 0.12);
                transform: translateX(5px);
            }

            .tip-emoji {
                font-size: 1.2rem;
                margin-right: 12px;
                width: 24px;
                text-align: center;
            }

            .tip-item span:last-child {
                color: var(--dark-color);
                font-weight: 500;
            }

            .modal-footer {
                padding: 15px 25px 25px;
                text-align: center;
            }

            .modal-btn {
                background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
                color: white;
                border: none;
                padding: 12px 30px;
                border-radius: 25px;
                font-size: 1rem;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(108, 155, 209, 0.3);
            }

            .modal-btn:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(108, 155, 209, 0.4);
            }

            .modal-btn:active {
                transform: translateY(0);
            }

            @media (max-width: 480px) {
                .modal-content {
                    width: 95%;
                    margin: 10px;
                }
                
                .modal-header, .modal-body, .modal-footer {
                    padding-left: 20px;
                    padding-right: 20px;
                }
                
                .tip-features {
                    gap: 10px;
                }
                
                .tip-item {
                    padding: 10px 12px;
                }
            }
        </style>
    </head>
    <body>

        <!-- 新功能提示对话框 -->
        <div id="featureTipModal" class="modal-overlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>🎉 新功能提示</h3>

        </div>

        <script>
            // 用于存储所有比赛数据和当前筛选
            let allBattles = [];
            let currentMapFilter = '全部';
            let profileData = null; // 添加全局变量存储profile数据

            // 页面加载完成后执行
            document.addEventListener('DOMContentLoaded', function() {
                const filename = '{{filename}}';
                loadGameData(filename);
                
                // 检查是否首次访问，如果是则显示新功能提示
                checkFirstVisit();
            });
            
            // 检查首次访问并显示新功能提示
            function checkFirstVisit() {
                const hasSeenUpdatesTip_20251006 = localStorage.getItem('hasSeenUpdatesTip_20251006');
                if (!hasSeenUpdatesTip_20251006|hasSeenUpdatesTip_20251006<2) {
                    // 延迟显示，确保页面加载完成
                    setTimeout(showFeatureTip, 1000);
                }
            }
            
            // 显示新功能提示对话框
            function showFeatureTip() {
                const modal = document.getElementById('featureTipModal');
                if (modal) {
                    modal.classList.add('show');
                }
            }
            
            // 关闭新功能提示对话框
            function closeFeatureTip() {
                const modal = document.getElementById('featureTipModal');
                if (modal) {
                    const hasSeenUpdatesTip_20251006 = localStorage.getItem('hasSeenUpdatesTip_20251006');
                    modal.classList.remove('show');
                    // 保存已查看状态，下次不再显示
                    localStorage.setItem('hasSeenUpdatesTip_20251006', Number(hasSeenUpdatesTip_20251006)+1);
                }
            }
            
            // 点击遮罩层也可以关闭对话框
            document.addEventListener('click', function(e) {
                const modal = document.getElementById('featureTipModal');
                if (e.target === modal) {
                    closeFeatureTip();
                }
            });
            
            // ESC键关闭对话框
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    const modal = document.getElementById('featureTipModal');
                    if (modal && modal.classList.contains('show')) {
                        closeFeatureTip();
                    }
                }
            });
            
            // 从服务器加载JSON数据
            async function loadGameData(filepath) {
                try {
                    const response = await fetch(filepath);
                    if (!response.ok) {
                        throw new Error(`HTTP错误: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    analyzeData(data);
                    
                } catch (error) {
                    console.error('加载数据失败:', error);
                    showError('加载数据失败: ' + error.message);
                }
            }
            
            // 显示加载状态
            function showLoading() {
                document.getElementById('loadingMessage').style.display = 'block';
                document.getElementById('playerSection').style.display = 'none';
                document.getElementById('hiddenMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'none';
            }
            
            // 显示错误信息
            function showError(message) {
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('playerSection').style.display = 'none';
                document.getElementById('hiddenMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('errorText').textContent = message;
            }
            
            // 分析游戏数据
            function analyzeData(data) {
                try {
                    hideLoading();
                    
                    // 检查数据完整性
                    if (!data) {
                        throw new Error('数据为空');
                    }
                    
                    
                    // 检查是否战绩隐藏
                    if (data.btlist && data.btlist.invisible) {
                        showHiddenMessage(data.btlist.invisDes || '战绩已隐藏');
                        return;
                    }
                    
                    // 显示玩家区域
                    document.getElementById('playerSection').style.display = 'block';
                    
                    // 更新玩家资料
                    if (data.profile) {
                        profileData = data.profile; // 保存到全局变量
                        updatePlayerProfile(data.profile);
                    }
                    
                    // 分析比赛数据
                    if (data.btlist && data.btlist.list) {
                        allBattles = data.btlist.list;
                        renderMapFilterBar(allBattles);
                        analyzeBattles(allBattles, currentMapFilter);
                    } else {
                        document.getElementById('battleItems').innerHTML = '<p>暂无比赛记录</p>';
                    }
                    
                } catch (error) {
                    console.error('分析数据失败:', error);
                    showError('数据分析失败: ' + error.message);
                }
            }
            
            // 隐藏加载状态
            function hideLoading() {
                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'none';
            }
            
            // 处理卡片点击事件，跳转到战斗详情页面
            function handleBattleCardClick(battle, profileData) {
                try {
                    // 从e.json数据中提取所需参数
                    const gameSvr = battle.gameSvrId || '';
                    const gameSeq = battle.gameSeq || '';
                    const targetRoleId = profileData.targetRoleId || '';
                    const relaySvr = battle.relaySvrId || '';
                    const battleType = parseInt(battle.pvpType) || 0;
                    
                    // 调试日志
                    console.log('战斗详情参数:', {
                        gameSvr: gameSvr,
                        gameSeq: gameSeq,
                        targetRoleId: targetRoleId,
                        relaySvr: relaySvr,
                        battleType: battleType
                    });
                    
                    // 构建URL参数
                    const params = new URLSearchParams({
                        gameSvr: gameSvr,
                        gameSeq: gameSeq,
                        targetRoleId: targetRoleId,
                        relaySvr: relaySvr,
                        battleType: battleType,
                        key: '{{key}}'
                    });
                    
                    // 构建完整URL并跳转
                    const targetUrl = `/jump-btldetail?${params.toString()}`;
                    console.log('跳转URL:', targetUrl);
                    window.open(targetUrl, '_blank');
                    
                } catch (error) {
                    console.error('跳转战斗详情失败:', error);
                    alert('跳转失败，请稍后重试');
                }
            }
            
            // 处理收藏按钮点击事件
            async function handleFavorite(battle, profileData, buttonElement) {
                try {
                    // 设置按钮为加载状态
                    buttonElement.classList.add('loading');
                    buttonElement.innerHTML = '⏳';
                    
                    // 提取战局信息参数
                    const gameSeq = battle.gameSeq || '';
                    
                    // 构建GET请求参数
                    const params = new URLSearchParams({
                        gameSeq: gameSeq,
                        key: '{{key}}'
                    });
                    
                    // 调试日志
                    console.log('收藏战局参数:', { gameSeq, key: '{{key}}' });
                    
                    // 发送GET请求到收藏接口
                    const response = await fetch(`/like-btldetail?${params.toString()}`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        console.log('收藏成功:', result);
                        
                        // 更新按钮状态为已收藏
                        buttonElement.classList.remove('loading');
                        buttonElement.classList.add('liked');
                        buttonElement.innerHTML = '♥';
                        buttonElement.title = '已收藏';
                        
                        // 显示成功提示
                        const message = result.message || '收藏成功！';
                        showToast(message, 'success');
                        
                    } else {
                        // 尝试解析错误响应
                        let errorMessage = '收藏失败，请稍后重试';
                        try {
                            const errorData = await response.json();
                            if (errorData.message) {
                                errorMessage = errorData.message;
                            } else if (errorData.detail && errorData.detail.message) {
                                // 处理FastAPI的detail.message格式
                                errorMessage = errorData.detail.message;
                            }
                        } catch (e) {
                            // 如果无法解析JSON，使用状态码信息
                            errorMessage = `收藏失败: ${response.status} ${response.statusText}`;
                        }
                        
                        // 直接显示错误信息，不抛出异常
                        buttonElement.classList.remove('loading');
                        buttonElement.innerHTML = '♡';
                        showToast(errorMessage, 'error');
                        return; // 直接返回，避免进入catch块
                    }
                    
                } catch (error) {
                    console.error('收藏战局失败:', error);
                    
                    // 恢复按钮状态
                    buttonElement.classList.remove('loading');
                    buttonElement.innerHTML = '♡';
                    
                    // 显示具体的错误提示
                    showToast(error.message || '收藏失败，请稍后重试', 'error');
                }
            }
            
            // 显示提示消息
            function showToast(message, type = 'info') {
                // 创建toast元素
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    padding: 12px 20px;
                    border-radius: 8px;
                    color: white;
                    font-weight: 500;
                    z-index: 10000;
                    opacity: 0;
                    transform: translateX(100%);
                    transition: all 0.3s ease;
                    max-width: 300px;
                    word-wrap: break-word;
                `;
                
                // 根据类型设置背景色
                if (type === 'success') {
                    toast.style.background = 'linear-gradient(135deg, #28a745, #20c997)';
                } else if (type === 'error') {
                    toast.style.background = 'linear-gradient(135deg, #dc3545, #e74c3c)';
                } else {
                    toast.style.background = 'linear-gradient(135deg, #6c9bd1, #4fc3f7)';
                }
                
                toast.textContent = message;
                document.body.appendChild(toast);
                
                // 显示动画
                setTimeout(() => {
                    toast.style.opacity = '1';
                    toast.style.transform = 'translateX(0)';
                }, 100);
                
                // 3秒后自动消失
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        document.body.removeChild(toast);
                    }, 300);
                }, 3000);
            }
            
            // 显示战绩隐藏信息
            function showHiddenMessage(message) {
                document.getElementById('playerSection').style.display = 'none';
                document.getElementById('hiddenMessage').style.display = 'block';
                document.getElementById('invisDes').textContent = message;
            }
            
            // 更新玩家资料
            function updatePlayerProfile(profileData) {
                try {
                    // 从profile.roleList中找到目标角色
                    const targetRoleId = profileData.targetRoleId;
                    const targetRole = profileData.roleList.find(role => role.roleId === targetRoleId);
                    
                    if (!targetRole) {
                        console.error('未找到目标角色信息');
                        return;
                    }
                    
                    // 获取角色基本信息
                    const roleName = targetRole.roleName || '未知玩家';
                    const roleJobName = targetRole.roleJobName || '无称号';
                    const avatar = targetRole.roleIcon || '';
                    
                    // 设置玩家信息
                    document.getElementById('playerName').textContent = roleName;
                    document.getElementById('playerTitle').textContent = roleJobName;
                    
                    // 设置头像
                    const avatarElement = document.getElementById('playerAvatar');
                    if (avatar) {
                        avatarElement.src = avatar;
                        avatarElement.style.display = 'block';
                    } else {
                        avatarElement.style.display = 'none';
                    }
                    
                    // 从profile.head.mods中获取统计数据
                    if (profileData.head && profileData.head.mods) {
                        const mods = profileData.head.mods;
                        
                        // 查找各种统计数据
                        const totalBattlesMod = mods.find(mod => mod.name === '总场次');
                        const mvpMod = mods.find(mod => mod.name === 'MVP');
                        const winRateMod = mods.find(mod => mod.name === '胜率');
                        
                        const totalBattles = totalBattlesMod ? totalBattlesMod.content : '0';
                        const mvpCount = mvpMod ? mvpMod.content : '0';
                        const winRate = winRateMod ? winRateMod.content : '0%';
                        
                        document.getElementById('totalBattles').textContent = totalBattles;
                        document.getElementById('mvpCount').textContent = mvpCount;
                        document.getElementById('winRate').textContent = winRate;
                    }
                    
                } catch (error) {
                    console.error('更新玩家资料失败:', error);
                }
            }

            // 新增：渲染地图筛选按钮栏
            function renderMapFilterBar(battles) {
                const mapFilterBar = document.getElementById('mapFilterBar');
                if (!battles || battles.length === 0) {
                    mapFilterBar.style.display = 'none';
                    return;
                }
                // 获取所有地图名
                const mapSet = new Set();
                battles.forEach(b => {
                    if (b.mapName && b.mapName.trim()) mapSet.add(b.mapName.trim());
                });
                const mapList = Array.from(mapSet).sort();
                mapList.unshift('全部');
                mapFilterBar.innerHTML = '';
                mapList.forEach(mapName => {
                    const btn = document.createElement('button');
                    btn.className = 'map-filter-btn' + (mapName === currentMapFilter ? ' active' : '');
                    btn.textContent = mapName;
                    btn.onclick = function() {
                        currentMapFilter = mapName;
                        // 更新按钮高亮
                        Array.from(mapFilterBar.children).forEach(child => child.classList.remove('active'));
                        btn.classList.add('active');
                        analyzeBattles(allBattles, currentMapFilter);
                    };
                    mapFilterBar.appendChild(btn);
                });
                mapFilterBar.style.display = 'flex';
            }
            
            // 分析比赛数据（支持地图筛选）
            function analyzeBattles(battles, mapFilter = '全部') {
                try {
                    // 筛选
                    let filteredBattles = battles;
                    if (mapFilter && mapFilter !== '全部') {
                        filteredBattles = battles.filter(b => (b.mapName || '').trim() === mapFilter);
                    }
                    // const recentBattles = filteredBattles.slice(0, 20);
                    const recentBattles = filteredBattles;
                    const battleItemsContainer = document.getElementById('battleItems');
                    battleItemsContainer.innerHTML = '';
                    
                    let totalWins = 0;
                    let totalKills = 0;
                    let totalDeaths = 0;
                    let totalAssists = 0;
                    let totalMvp = 0;
                    
                    recentBattles.forEach((battle, index) => {
                        // 创建比赛项目
                        const battleItem = document.createElement('div');
                        const gameResult = parseInt(battle.gameresult) || 0;
                        const resultClass = gameResult === 1 ? 'win' : 'lose';
                        const bgClass = gameResult === 1 ? 'win-bg' : 'lose-bg';
                        battleItem.className = `battle-item ${bgClass}`;
                        battleItem.style.cursor = 'pointer'; // 添加鼠标指针样式
                        const resultText = gameResult === 1 ? '胜利' : '失败';
                        
                        const killcnt = parseInt(battle.killcnt) || 0;
                        const deadcnt = parseInt(battle.deadcnt) || 0;
                        const assistcnt = parseInt(battle.assistcnt) || 0;
                        const mvpcnt = parseInt(battle.mvpcnt) || 0;
                        const losemvp = parseInt(battle.losemvp) || 0;
                        const gradeGame = parseFloat(battle.gradeGame) || 0;
                        const gametime = battle.gametime || "";
                        
                        const kda = (killcnt + assistcnt) / Math.max(deadcnt, 1);
                        
                        // 获取段位信息
                        const roleJobName = battle.roleJobName || '';
                        const stars = battle.stars || 0;
                        const rankInfo = roleJobName ? `${roleJobName} ${stars}⭐` : '';
                        
                        // 获取巅峰分信息
                        const oldMasterScore = parseInt(battle.oldMasterMatchScore) || 0;
                        const newMasterScore = parseInt(battle.newMasterMatchScore) || 0;
                        const scoreDiff = newMasterScore - oldMasterScore;
                        
                        // 判断游戏类型显示相应信息 - 修正巅峰赛判断逻辑
                        let gameTypeInfo = '';
                        
                        // 检查是否为巅峰赛：gametype为4或者有巅峰分数据
                        const isPeakMatch = (battle.gametype === 14);

                        const isTournaMatch = (battle.gametype === 4);
                        
                        if (isPeakMatch) {
                            const scoreChangeText = scoreDiff > 0 ? `+${scoreDiff}` : `${scoreDiff}`;
                            const scoreChangeClass = scoreDiff > 0 ? 'score-increase' : (scoreDiff < 0 ? 'score-decrease' : '');
                            gameTypeInfo = `
                                <div class="rank-value">
                                    ${oldMasterScore}→${newMasterScore} 
                                    <span class="${scoreChangeClass}">(${scoreChangeText})</span>
                                </div>
                            `;
                        } 
                        else if (isTournaMatch) {
                            gameTypeInfo = `
                                <div class="rank-value">${rankInfo}</div>
                            `;
                        }
                        else if (rankInfo) {
                            gameTypeInfo = ''
                        }
                        
                        // 获取游戏时长
                        const usedTime = battle.usedTime || 0;
                        const gameTimeText = usedTime > 0 ? `${Math.floor(usedTime / 60)}分${usedTime % 60}秒` : '';
                        
                        // 获取特殊击杀信息
                        const rampage = battle.rampage || 0;
                        const godLike = battle.godLikeCnt || 0;
                        const firstBlood = battle.firstBlood || 0;
                        const tripleKill = battle.hero1TripleKillCnt || 0;
                        const ultraKill = battle.hero1UltraKillCnt || 0;
                        const rampageKill = battle.hero1RampageCnt || 0;
                        
                        let specialKills = [];
                        if (firstBlood > 0) specialKills.push('一血');
                        if (tripleKill > 0) specialKills.push(`三杀`);
                        if (ultraKill > 0) specialKills.push(`四杀`);
                        if (rampageKill > 0) specialKills.push(`五杀`);
                        if (godLike > 0) specialKills.push(`超神`);
                        
                        const specialKillText = specialKills.length > 0 ? specialKills.join(' ') : '';
                        
                        battleItem.innerHTML = `
                            <img src="${battle.heroIcon || ''}" alt="英雄头像" class="hero-icon" onerror="this.style.display='none'">
                            <div class="battle-info">
                                <div class="battle-header">
                                    <div class="battle-title">
                                        <strong style="font-size: 0.95rem; color: var(--dark-color);">${battle.mapName || '未知地图'}</strong>
                                    </div>
                                </div>
                                <div class="battle-meta">
                                    <div class="battle-time">
                                        <div>${gametime}</div>
                                        ${gameTimeText ? `<div>${gameTimeText}</div>` : ''}
                                    </div>
                                    <div class="game-type-info">
                                        ${gameTypeInfo}
                                    </div>
                                </div>
                                <div class="stats">
                                    <div class="stat kda-stat">
                                        <span class="stat-value">${killcnt}/${deadcnt}/${assistcnt}</span>
                                    </div>
                                    <div class="stat grade-stat">
                                        <span class="stat-label">评分</span>
                                        <span class="stat-value">${gradeGame.toFixed(1)}</span>
                                    </div>
                                    ${specialKillText ? `
                                    <div class="stat special-kills">
                                        ${specialKillText}
                                    </div>
                                    ` : ''}
                                    ${mvpcnt > 0||losemvp>0 ? `
                                    <div class="battle-badges">
                                        <span class="mvp-badge">MVP</span>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                            <button class="favorite-btn" title="收藏战局" data-battle-index="${index}">
                                ♡
                            </button>
                        `;
                        
                        // 添加点击事件处理
                        battleItem.addEventListener('click', function(e) {
                            // 如果点击的是收藏按钮，不触发战局详情跳转
                            if (e.target.classList.contains('favorite-btn')) {
                                return;
                            }
                            handleBattleCardClick(battle, profileData);
                        });
                        
                        // 添加收藏按钮事件处理
                        const favoriteBtn = battleItem.querySelector('.favorite-btn');
                        favoriteBtn.addEventListener('click', function(e) {
                            e.stopPropagation(); // 阻止事件冒泡
                            handleFavorite(battle, profileData, this);
                        });
                        
                        battleItemsContainer.appendChild(battleItem);
                        // 统计数据
                        if (gameResult === 1) totalWins++;
                        totalKills += killcnt;
                        totalDeaths += deadcnt;
                        totalAssists += assistcnt;
                        if (mvpcnt > 0 || losemvp > 0) totalMvp++;
                    });
                    // const children = Array.from(battleItemsContainer.children);
                    // battleItemsContainer.innerHTML = ''; // 清空容器
                    // children.reverse().forEach(child => battleItemsContainer.appendChild(child));
                    // 更新统计卡片
                    const totalGames = recentBattles.length;
                    
                    // if (totalGames > 0) {
                    //     // 最近10场胜率（用于"近期表现"卡片）
                    //     const recent10Battles = battles.slice(0, 10);
                    //     const recent10Wins = recent10Battles.filter(b => parseInt(b.gameresult) === 1).length;
                    //     const recent10WinRate = (recent10Wins / Math.min(recent10Battles.length, 10) * 100).toFixed(1);
                        
                    //     // 整体KDA和MVP率（基于最近20场）
                    //     const avgKDA = ((totalKills + totalAssists) / Math.max(totalDeaths, 1)).toFixed(1);
                    //     const mvpRate = (totalMvp / totalGames * 100).toFixed(1);
                        
                    //     document.getElementById('recentWinRate').textContent = `${recent10WinRate}%`;
                    //     document.getElementById('avgKDA').textContent = avgKDA;
                    //     document.getElementById('mvpRate').textContent = `${mvpRate}%`;
                        
                    //     // 创建图表
                    //     createCharts(recentBattles);
                    // }
                    // 新增：如果没有比赛，显示提示
                    if (recentBattles.length === 0) {
                        battleItemsContainer.innerHTML = '<p>该地图暂无比赛记录</p>';
                    }
                } catch (error) {
                    console.error('分析比赛数据失败:', error);
                    document.getElementById('battleItems').innerHTML = '<p>比赛数据解析失败</p>';
                }
            }
            
            // 创建图表
            function createCharts(battles) {
                try {
                    if (typeof echarts === 'undefined') {
                        console.error('ECharts未加载');
                        return;
                    }
                    
                    // KDA趋势图
                    const kdaChart = echarts.init(document.getElementById('kdaChart'));
                    
                    const dates = battles.map(battle => battle.gametime || '未知时间');
                    const kills = battles.map(battle => parseInt(battle.killcnt) || 0);
                    const deaths = battles.map(battle => parseInt(battle.deadcnt) || 0);
                    const assists = battles.map(battle => parseInt(battle.assistcnt) || 0);
                    const kdaValues = battles.map(battle => {
                        const k = parseInt(battle.killcnt) || 0;
                        const d = parseInt(battle.deadcnt) || 0;
                        const a = parseInt(battle.assistcnt) || 0;
                        return ((k + a) / Math.max(d, 1)).toFixed(1);
                    });
                    
                    kdaChart.setOption({
                        title: {
                            text: 'KDA趋势分析',
                            left: 'center'
                        },
                        tooltip: {
                            trigger: 'axis'
                        },
                        legend: {
                            data: ['击杀', '死亡', '助攻', 'KDA'],
                            bottom: 10
                        },
                        xAxis: {
                            type: 'category',
                            data: dates,
                            axisLabel: {
                                rotate: 45
                            }
                        },
                        yAxis: [
                            {
                                type: 'value',
                                name: '数量',
                                min: 0
                            },
                            {
                                type: 'value',
                                name: 'KDA',
                                min: 0
                            }
                        ],
                        series: [
                            {
                                name: '击杀',
                                type: 'bar',
                                data: kills,
                                itemStyle: { color: '#81c784' }
                            },
                            {
                                name: '死亡',
                                type: 'bar',
                                data: deaths,
                                itemStyle: { color: '#e57373' }
                            },
                            {
                                name: '助攻',
                                type: 'bar',
                                data: assists,
                                itemStyle: { color: '#4fc3f7' }
                            },
                            {
                                name: 'KDA',
                                type: 'line',
                                yAxisIndex: 1,
                                data: kdaValues,
                                itemStyle: { color: '#ff8a65' },
                                lineStyle: { width: 3 }
                            }
                        ]
                    });
                    
                    // 雷达图
                    const performanceChart = echarts.init(document.getElementById('performanceChart'));
                    
                    const avgKills = (kills.reduce((a, b) => a + b, 0) / kills.length).toFixed(1);
                    const avgDeaths = (deaths.reduce((a, b) => a + b, 0) / deaths.length).toFixed(1);
                    const avgAssists = (assists.reduce((a, b) => a + b, 0) / assists.length).toFixed(1);
                    const mvpCount = battles.filter(b => (parseInt(b.mvpcnt) || 0) > 0 || (parseInt(b.losemvp) || 0) > 0).length;
                    const mvpRate = (mvpCount / battles.length * 100).toFixed(1);
                    const avgGrade = (battles.reduce((sum, battle) => sum + (parseFloat(battle.gradeGame) || 0), 0) / battles.length).toFixed(1);
                    
                    performanceChart.setOption({
                        title: {
                            text: '综合表现雷达图',
                            left: 'center'
                        },
                        radar: {
                            indicator: [
                                { name: '平均击杀', max: 10 },
                                { name: '平均助攻', max: 15 },
                                { name: '平均死亡', max: 10 },
                                { name: 'MVP率(%)', max: 100 },
                                { name: '平均评分', max: 10 }
                            ],
                            radius: '65%'
                        },
                        series: [{
                            name: '表现对比',
                            type: 'radar',
                            data: [{
                                value: [avgKills, avgAssists, avgDeaths, mvpRate, avgGrade],
                                name: '你的表现'
                            }],
                            areaStyle: {
                                color: 'rgba(255, 138, 101, 0.4)'
                            },
                            lineStyle: {
                                color: '#ff8a65',
                                width: 2
                            }
                        }]
                    });
                    
                    // 响应式调整
                    window.addEventListener('resize', function() {
                        kdaChart.resize();
                        performanceChart.resize();
                    });
                    
                } catch (error) {
                    console.error('创建图表失败:', error);
                }
            }
        </script>
    </body>
    </html>
