name: Deploy GloryBond

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hok-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public source and deployment boundaries
        run: |
          python -m pip install PyYAML python-dotenv markdown-it-py
          python tools/verify_repository.py
          python -m unittest discover -s tools -p 'test_history_privacy.py'
          python -m unittest discover -s deployment/tests
          python scripts/validate_agent_manual.py
  deploy:
    needs: verify
    runs-on: [self-hosted, Linux, X64, hok-production]
    if: ${{ github.repository == 'Raysance/GloryBond' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Update and deploy the unified project
        working-directory: /srv/modules/hok/apps/HOK_QQBot
        run: |
          git fetch origin main
          git show origin/main:deployment/scripts/deploy_project.sh | bash -s -- origin/main
