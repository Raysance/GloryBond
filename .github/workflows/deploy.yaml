name: Deploy HOK QQBot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: hok-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Update and deploy the unified project
        working-directory: /srv/modules/hok/apps/HOK_QQBot
        run: |
          git fetch origin main
          git show origin/main:deployment/scripts/deploy_project.sh | bash -s -- origin/main
