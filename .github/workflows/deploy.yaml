name: Deploy HOK QQBot WebService

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Pull and restart app
        run: |
          cd /QQBot/Web/
          
          git fetch
          git reset --hard origin/main

          systemctl restart hok-web.service
          systemctl is-active --quiet hok-web.service
