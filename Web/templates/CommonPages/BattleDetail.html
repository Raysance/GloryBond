<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>战局详情-笙煎守味🤖</title>
    <style>
        :root {
            --primary-color: #6c9bd1;
            --secondary-color: #4fc3f7;
            --dark-color: #2c3e50;
            --light-color: #f8f9fa;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --accent-color: #6c757d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f2f3f5;
            color: #1c1c1e;
            line-height: 1.6;
            min-height: 100vh;
        }

        body.victory {
            background:
                radial-gradient(circle at 18% 0%, rgba(52, 199, 89, 0.24), transparent 34%),
                linear-gradient(180deg, rgba(52, 199, 89, 0.14) 0%, rgba(52, 199, 89, 0.08) 42%, #eef1f4 100%) !important;
        }

        body.defeat {
            background:
                radial-gradient(circle at 18% 0%, rgba(255, 59, 48, 0.23), transparent 34%),
                linear-gradient(180deg, rgba(255, 59, 48, 0.13) 0%, rgba(255, 59, 48, 0.08) 42%, #eef1f4 100%) !important;
        }

        .container {
            max-width: 95%;
            width: 100%;
            margin: 0 auto;
            padding: 168px 20px 20px;
            background: transparent;
            transition: padding-top 0.25s ease;
        }

        body.metadata-collapsed .container {
            padding-top: 96px;
        }
        
        @media (min-width: 1920px) {
            .container {
                max-width: 90%;
            }
        }
        
        @media (min-width: 2560px) {
            .container {
                max-width: 85%;
            }
        }

        .teams-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
            width: 100%;
        }
        
        @media (min-width: 1200px) {
            .teams-section {
                gap: 40px;
            }
        }

        .team {
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.68);
            border-radius: 18px;
            padding: 14px;
            box-shadow:
                0 16px 34px rgba(31, 35, 41, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            overflow: hidden;
        }

        .team-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 2px 2px 10px;
            border-bottom: 1px solid rgba(60, 60, 67, 0.12);
        }

        .team-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0;
        }

        .team.red .team-name {
            color: #ff3b30;
        }

        .team.blue .team-name {
            color: #007aff;
        }

        .team-stats {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: 600;
        }

        .win-indicator {
            color: #1f8f45;
            padding: 0;
            border-radius: 0;
            font-size: 13px;
            font-weight: 700;
            border: none;
            box-shadow: none;
        }

        .lose-indicator {
            color: #c9362d;
            padding: 0;
            border-radius: 0;
            font-size: 13px;
            font-weight: 700;
            border: none;
            box-shadow: none;
        }

        .players-grid {
            display: grid;
            gap: 8px;
        }

        .player-card {
            background: rgba(255, 255, 255, 0.56);
            padding: 8px 10px;
            border: 1px solid rgba(60, 60, 67, 0.07);
            border-radius: 14px;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
            min-height: 72px;
            display: flex;
            align-items: stretch;
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.70);
        }

        .player-card:hover {
            background-color: rgba(255, 255, 255, 0.76);
            transform: translateY(-1px);
            box-shadow:
                0 10px 20px rgba(31, 35, 41, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.80);
        }

        .player-card::before {
            content: "›";
            position: absolute;
            top: 50%;
            right: 9px;
            font-size: 22px;
            line-height: 1;
            color: rgba(60, 60, 67, 0.28);
            opacity: 0.7;
            transform: translateY(-50%);
            transition: opacity 0.2s ease;
            pointer-events: none;
            z-index: 2;
        }

        .player-card:hover::before {
            opacity: 1;
        }

        .player-card.card-loading {
            cursor: wait;
            opacity: 0.78;
            transition: opacity 0.2s ease;
        }

        .player-card.card-loading::before {
            content: "...";
            opacity: 0.9;
        }

        /* MVP 卡片保持识别度，但避免强闪光动画 */
        .player-card.mvp-highlight {
            background: rgba(255, 248, 225, 0.72);
            border-color: rgba(245, 158, 11, 0.28);
            box-shadow:
                0 10px 22px rgba(245, 158, 11, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.78);
            border-radius: 14px;
        }

        .img-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            border-radius: inherit;
            font-weight: bold;
            color: #555;
            padding: 2px;
            box-sizing: border-box;
            word-break: break-all;
            line-height: 1.2;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
            text-align: center;
        }

        .img-container {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #eee;
        }

        .player-card.mvp-highlight::before {
            content: "›";
            background: none;
            animation: none;
            transform: translateY(-50%);
        }

        .player-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.26;
            z-index: 0;
            background-image: inherit;
            mask: linear-gradient(to left, 
                rgba(0,0,0,1) 0%, 
                rgba(0,0,0,0.70) 20%,
                rgba(0,0,0,0.36) 50%,
                rgba(0,0,0,0.12) 80%,
                rgba(0,0,0,0) 100%);
            -webkit-mask: linear-gradient(to left, 
                rgba(0,0,0,1) 0%, 
                rgba(0,0,0,0.70) 20%,
                rgba(0,0,0,0.36) 50%,
                rgba(0,0,0,0.12) 80%,
                rgba(0,0,0,0) 100%);
        }

        .player-card:last-child {
            border-bottom: none;
        }

        .player-main {
            display: grid;
            grid-template-columns: 42px minmax(170px, 1fr) minmax(130px, 0.74fr);
            align-items: center;
            gap: 10px;
            flex: 1;
            position: relative;
            z-index: 1;
            padding-right: clamp(34px, 8vw, 116px);
            min-height: 58px;
            min-width: 0;
        }

        .hero-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: none;
            box-shadow: 0 3px 10px rgba(31, 35, 41, 0.18);
            flex-shrink: 0;
        }

        .hero-avatar-container {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .current-hero-avatar-container {
            width: 86px;
            height: 86px;
            padding: 3px;
            border-radius: 50%;
            flex-shrink: 0;
            background:
                radial-gradient(circle, transparent 58%, var(--result-glow, rgba(108, 155, 209, 0.62)) 66%, transparent 78%),
                conic-gradient(from 210deg, transparent 0 12%, var(--result-glow, rgba(108, 155, 209, 0.62)) 34%, transparent 60% 100%);
            box-shadow:
                0 8px 22px rgba(0, 0, 0, 0.15),
                0 0 18px var(--result-soft-glow, rgba(108, 155, 209, 0.18));
            overflow: visible;
        }

        .current-hero-avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.75);
        }

        .player-info {
            flex: 0 0 auto;
            min-width: 0;
            max-width: 100%;
        }

        .player-center {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 8px;
            min-height: 56px;
        }

        .player-center-top {
            display: grid;
            grid-template-columns: minmax(42px, 0.9fr) minmax(58px, 1.1fr);
            gap: 4px;
            margin-bottom: 8px;
            align-items: center;
            justify-content: stretch;
            width: 100%;
            max-width: 100%;
            white-space: nowrap;
        }

        .player-center-rating,
        .player-center-kda {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            line-height: 1.05;
        }

        .metric-value {
            min-width: 0;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.05;
        }

        .player-center-rating .metric-value {
            color: #007aff;
        }

        .player-center-kda .metric-value {
            color: #1c1c1e;
        }

        .stats-percentage-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(28px, 1fr));
            gap: 4px;
            margin: 0;
            justify-content: stretch;
            flex-wrap: nowrap;
            width: 100%;
            max-width: 100%;
            white-space: nowrap;
        }

        .stat-percentage {
            text-align: center;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            justify-content: center;
            flex: 0 1 auto;
            padding: 0 4px;
        }

        .stat-percentage-value {
            font-size: 12px;
            font-weight: 700;
            color: #1c1c1e;
            line-height: 1.1;
        }

        .stat-percentage-icon {
            font-size: 13px;
            line-height: 1;
            color: rgba(60, 60, 67, 0.58);
        }

        .player-left {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
            min-width: 0;
            max-width: 100%;
            justify-content: flex-start;
        }

        .player-left-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .player-info h4 {
            font-size: 16px;
            margin-bottom: 0;
            color: #1c1c1e;
            font-weight: 700;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .equipment {
            margin-top: 0;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 100%;
        }

        .equipment h5 {
            display: none;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(18px, 22px));
            gap: 3px;
            width: min(100%, 147px);
            max-width: 100%;
            align-items: center;
        }

        .equipment-item {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 5px;
            object-fit: cover;
            border: none;
            background: rgba(118, 118, 128, 0.12);
            min-width: 0;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.38);
        }

        .equipment-item-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
            display: block;
        }

        .mvp-badge {
            background: rgba(245, 158, 11, 0.14);
            color: #a15c00;
            padding: 2px 7px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 700;
            margin-left: 8px;
        }

        @media (max-width: 1100px) and (min-width: 769px) {
            .player-card::after {
                width: 96px;
            }

            .player-main {
                grid-template-columns: 40px minmax(112px, 1fr) minmax(112px, 0.75fr);
                padding-right: 66px;
            }

            .equipment-grid {
                grid-template-columns: repeat(6, minmax(16px, 19px));
                gap: 2px;
                width: min(100%, 124px);
            }

            .stat-percentage {
                flex-basis: auto;
            }

            .stats-percentage-row {
                gap: 9px;
            }

            .stat-percentage-value {
                font-size: 12px;
            }
        }

        .team-summary {
            margin-bottom: 20px;
        }

        .team-comparison {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 25px;
            margin-bottom: 15px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            border-top: 1px solid #e9ecef;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 204px 10px 10px;
            }

            body.metadata-collapsed .container {
                padding-top: 116px;
            }
            
            .current-player-info {
                flex-direction: column !important;
                align-items: center !important;
                gap: 15px !important;
                text-align: center !important;
            }
            
            .current-player-avatar {
                width: 50px !important;
                height: 50px !important;
            }
            
            .current-player-name {
                justify-content: center !important;
                gap: 10px !important;
            }
            
            .current-player-name h4 {
                font-size: 18px !important;
            }
            
            .current-player-stats {
                justify-content: center !important;
                gap: 15px !important;
            }
            
            .current-player-stats div:first-child {
                font-size: 16px !important;
            }
            
            .current-player-stats div:last-child {
                font-size: 14px !important;
            }
            
            .current-player-percentages {
                gap: 20px !important;
            }
            
            .current-player-percentages > div {
                min-width: 50px !important;
            }
            
            .current-player-percentages div:first-child {
                font-size: 14px !important;
            }
            
            .current-player-equipment img {
                width: 24px !important;
                height: 24px !important;
            }
            
            /* 标题栏移动端优化 */
            .team-comparison {
                margin-bottom: 10px;
            }
            
            .team-comparison > div {
                padding: 20px !important;
            }
            
            .team-comparison h3 {
                font-size: 22px !important;
            }
            
            .team-comparison .equipment img {
                width: 32px !important;
                height: 32px !important;
                margin: 2px !important;
            }
            
            .team-comparison .player-stats {
                gap: 20px !important;
            }
            
            .team-comparison .player-stats > div {
                font-size: 14px !important;
            }
            
            .teams-section {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .team {
                padding: 12px;
            }
            
            .team-header {
                margin-bottom: 12px;
                padding-bottom: 8px;
            }
            
            .team-name {
                font-size: 18px;
            }
            
            .team-stats {
                font-size: 14px;
            }
            
            .win-indicator,
            .lose-indicator {
                padding: 4px 8px;
                font-size: 12px;
                background: transparent;
                border-radius: 0;
            }
            
            .players-grid {
                gap: 3px;
            }
            
            .player-card {
                padding: 6px 0;
                min-height: 64px;
            }
            
            .player-card.mvp-highlight {
                border-radius: 6px;
                padding: 8px;
                margin: 2px 0;
            }
            
            .player-card::after {
                width: 72px;
            }
            
            .player-main {
                grid-template-columns: 36px minmax(92px, 1fr) minmax(104px, 0.85fr);
                gap: 6px;
                padding-right: clamp(18px, 8vw, 44px);
                min-height: 54px;
            }
            
            .player-left {
                gap: 4px;
            }
            
            .player-left-top {
                gap: 6px;
            }
            
            .player-center {
                padding: 4px;
                min-height: 52px;
            }
            
            .player-center-top {
                gap: 3px;
                margin-bottom: 6px;
            }
            
            .stats-percentage-row {
                gap: 3px;
            }
            
            .stat-percentage {
                gap: 1px;
                padding: 0 2px;
            }
            
            .stat-percentage-value {
                font-size: 10px;
            }

            .stat-percentage-icon {
                font-size: 11px;
            }
            
            .hero-avatar {
                width: 36px;
                height: 36px;
            }

            .hero-avatar-container {
                width: 36px;
                height: 36px;
            }
            
            .player-info h4 {
                font-size: 13px;
                margin-bottom: 2px;
            }

            .player-center-rating,
            .player-center-kda {
                padding: 0 2px;
            }

            .metric-value {
                font-size: 13px;
            }
            
            .mvp-badge {
                padding: 1px 3px;
                font-size: 8px;
                margin-left: 4px;
            }
            
            .equipment {
                margin-top: 4px;
            }
            
            .equipment-grid {
                grid-template-columns: repeat(6, minmax(13px, 16px));
                gap: 2px;
                width: min(100%, 106px);
            }
            
            .equipment-item {
                width: 100%;
            }
            
            .footer {
                padding: 15px;
                font-size: 12px;
                margin-top: 20px;
            }
        }

        .error {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            margin: 20px;
        }

        body::after {
            content: '';
            position: fixed;
            top: 16px;
            right: 16px;
            width: 216px;
            height: 60px;
            border-radius: 30px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0.18) 48%, rgba(255, 255, 255, 0.08)),
                radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.16) 36%, transparent 58%);
            border: 1px solid rgba(255, 255, 255, 0.62);
            box-shadow:
                0 14px 34px rgba(44, 62, 80, 0.26),
                0 1px 0 rgba(255, 255, 255, 0.45),
                inset 0 1px 1px rgba(255, 255, 255, 0.85),
                inset 0 -1px 2px rgba(255, 255, 255, 0.20),
                inset 12px 0 24px rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(30px) saturate(220%) contrast(1.06);
            -webkit-backdrop-filter: blur(30px) saturate(220%) contrast(1.06);
            pointer-events: none;
            z-index: 1099;
        }

        .battle-metadata {
            position: fixed;
            top: 16px;
            left: 50%;
            z-index: 1100;
            width: clamp(320px, calc(100vw - 480px), 720px);
            padding: 12px 14px;
            border-radius: 24px;
            transform: translateX(-50%);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.22) 52%, rgba(255, 255, 255, 0.10)),
                radial-gradient(circle at 18% 10%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.18) 44%, transparent 66%),
                radial-gradient(circle at 86% 0%, rgba(108, 155, 209, 0.20), transparent 42%);
            border: 1px solid rgba(255, 255, 255, 0.68);
            box-shadow:
                0 18px 44px rgba(44, 62, 80, 0.24),
                0 1px 0 rgba(255, 255, 255, 0.44),
                inset 0 1px 1px rgba(255, 255, 255, 0.90),
                inset 0 -1px 2px rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(30px) saturate(220%) contrast(1.06);
            -webkit-backdrop-filter: blur(30px) saturate(220%) contrast(1.06);
            color: #2c3e50;
            overflow: hidden;
            isolation: isolate;
            transition: padding 0.25s ease, border-radius 0.25s ease, box-shadow 0.25s ease;
        }

        .battle-metadata::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: inherit;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent 46%),
                radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.62), transparent 42%);
            opacity: 0.82;
            pointer-events: none;
            z-index: 0;
        }

        .battle-metadata > * {
            position: relative;
            z-index: 1;
        }

        .battle-fixed-layer {
            height: 0;
        }

        .battle-metadata-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .battle-metadata-title {
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex: 1;
            white-space: nowrap;
        }

        .battle-metadata-map {
            min-width: 0;
            flex: 0 1 auto;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 14px;
            color: rgba(44, 62, 80, 0.70);
            font-weight: 700;
        }

        .battle-metadata-result {
            flex-shrink: 0;
            font-size: 16px;
            font-weight: 800;
        }

        .battle-metadata-expanded {
            margin-top: 6px;
        }

        .battle-metadata-toggle {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.56);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.28);
            color: rgba(44, 62, 80, 0.72);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.78),
                0 5px 14px rgba(44, 62, 80, 0.12);
            transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease;
        }

        .battle-metadata-toggle:hover {
            background: rgba(255, 255, 255, 0.42);

<body class="ios-glass-page">
    <div class="container">
        <div class="loading" id="loading">正在加载战局数据...</div>
        <div id="content" style="display: none;">
            <!-- 内容将通过JavaScript动态生成 -->
        </div>
    </div>

    <button id="backFloatingBtn" class="floating-back-btn" type="button" title="返回上一页" aria-label="返回上一页">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"></path>
        </svg>
    </button>

    <div id="modalLinkLoadingOverlay" class="modal-link-loading-overlay" aria-hidden="true" role="alert" aria-live="assertive">
        <div class="modal-link-loading-content">
            <div class="modal-link-loading-spinner" role="presentation"></div>
            <div class="modal-link-loading-text">正在跳转，请稍候...</div>
        </div>
    </div>

    <script>
        // 全局变量
    let battleData = null;
    const modalLinkTimers = new WeakMap();
    const playerCardLoadingTimers = new WeakMap();

        function setupBackButton() {
            const backBtn = document.getElementById('backFloatingBtn');
            if (!backBtn) {
                return;
            }

            const navigateBack = () => {
                if (backBtn.dataset.busy === 'true') {
                    return;
                }

                backBtn.dataset.busy = 'true';
                backBtn.classList.add('loading');

                if (window.history.length > 1) {
                    window.history.back();
                } else if (document.referrer) {
                    window.location.href = document.referrer;
                } else {
                    window.location.href = '/';
                }

                setTimeout(() => {
                    delete backBtn.dataset.busy;
                    backBtn.classList.remove('loading');
                }, 1200);
            };

            backBtn.addEventListener('click', navigateBack);
            backBtn.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    navigateBack();
                }
            });
        }

        function showModalLinkLoading(message = '正在跳转，请稍候...') {
            const overlay = document.getElementById('modalLinkLoadingOverlay');
            if (!overlay) {
                return;
            }

            const textElement = overlay.querySelector('.modal-link-loading-text');
            if (textElement) {
                textElement.textContent = message;
            }

            overlay.classList.toggle('data-fetch-loading', message.includes('获取数据中'));
            overlay.classList.add('show');
            overlay.setAttribute('aria-hidden', 'false');
        }

        function hideModalLinkLoading() {
            const overlay = document.getElementById('modalLinkLoadingOverlay');
            if (!overlay) {
                return;
            }

            overlay.classList.remove('show');
            overlay.classList.remove('data-fetch-loading');
            overlay.setAttribute('aria-hidden', 'true');
        }

        function resetModalLink(link) {
            if (!link) {
                return;
            }

            const timerId = modalLinkTimers.get(link);
            if (timerId) {
                clearTimeout(timerId);
                modalLinkTimers.delete(link);
            }

            delete link.dataset.loading;
            link.classList.remove('modal-link-disabled');
            link.removeAttribute('aria-disabled');
        }

        function markPlayerCardLoading(card) {
            if (!card) {
                return;
            }

            const existingTimer = playerCardLoadingTimers.get(card);
            if (existingTimer) {
                clearTimeout(existingTimer);
            }

            card.dataset.loading = 'true';
            card.classList.add('card-loading');
            card.style.pointerEvents = 'none';

            const timerId = setTimeout(() => {
                hideModalLinkLoading();
                releasePlayerCardLoading(card);
            }, 12000);

            playerCardLoadingTimers.set(card, timerId);
        }

        function releasePlayerCardLoading(card) {
            if (!card) {
                return;
            }

            const timerId = playerCardLoadingTimers.get(card);
            if (timerId) {
                clearTimeout(timerId);
                playerCardLoadingTimers.delete(card);
            }

            delete card.dataset.loading;
            card.classList.remove('card-loading');
            card.style.removeProperty('pointer-events');
        }

        function releaseModalLoadingState(modal) {
            if (!modal) {
                return;
            }

            delete modal.dataset.loading;
            modal.querySelectorAll('a[href]').forEach((anchor) => {
                resetModalLink(anchor);
            });
        }

        // 加载JSON数据
        async function loadBattleData() {
            try {
                const response = await fetch('{{filename}}');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const text = await response.text();
                
                try {
                    battleData = JSON.parse(text);
                    
                    // 如果解析结果是字符串，可能需要再次解析
                    if (typeof battleData === 'string') {
                        battleData = JSON.parse(battleData);
                    }
                } catch (parseError) {
                    throw new Error('JSON解析失败: ' + parseError.message);
                }
                
                renderBattleDashboard();
                
                // 检查首次访问并显示新功能提示
                checkFirstVisit();

        // 格式化时间

        // 处理图片加载逻辑
        function handleImageLoad(imgElement, fallbackText, timeout = 2000) {
            if (!imgElement) return;

            const timer = setTimeout(() => {
                if (!imgElement.complete || imgElement.naturalWidth === 0) {
                    switchToFallback(imgElement, fallbackText);
                }
            }, timeout);

            imgElement.onload = () => {
                clearTimeout(timer);
                imgElement.style.display = 'block';
                const next = imgElement.nextElementSibling;
                if (next && next.classList.contains('img-placeholder')) {
                    next.remove();
                }
            };

            imgElement.onerror = () => {
                clearTimeout(timer);
                switchToFallback(imgElement, fallbackText);
            };
        }

        function switchToFallback(imgElement, text) {
            imgElement.style.display = 'none';
            if (imgElement.nextElementSibling && imgElement.nextElementSibling.classList.contains('img-placeholder')) {
                return;
            }
            const placeholder = document.createElement('div');
            placeholder.className = 'img-placeholder';
            
            // 适配文字大小
            if (text.length > 3) {
                placeholder.style.fontSize = '8px';
            } else if (text.length > 2) {
                placeholder.style.fontSize = '10px';
            } else {
                placeholder.style.fontSize = '12px';
            }
            
            placeholder.textContent = text;
            imgElement.parentNode.insertBefore(placeholder, imgElement.nextSibling);
        }

        // 渲染队伍对比 - 合并的标题和当前玩家信息
        function renderTeamComparison(data) {
            const { redTeam, blueTeam, head, redRoles, blueRoles, battle } = data;

            // 找到当前玩家的详细信息

        // 切换玩家详情显示/隐藏
        function togglePlayerDetails() {
            const playerDetails = document.querySelectorAll('.player-detail');
            const playerCards = document.querySelectorAll('.player-card');
            const toggleBtn = document.getElementById('toggleDetailsBtn');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');
            
            // 获取当前状态，如果没有设置则默认为0（显示所有）
            let currentMode = parseInt(toggleBtn.dataset.mode || '0');
            
            // 切换到下一个模式
            currentMode = (currentMode + 1) % 3;
            toggleBtn.dataset.mode = currentMode;
            
            switch (currentMode) {
                case 0: // 显示所有
                    playerDetails.forEach(detail => {
                        detail.style.display = '';
                    });
                    playerCards.forEach(card => {
                        const afterElement = card.querySelector('::after');
                        card.style.setProperty('--after-display', 'block');
                    });
                    // 恢复皮肤背景显示

                        card.style.setProperty('--mask-opacity', '1');
                    });
                    
                    eyeIcon.style.display = 'block';
                    eyeOffIcon.style.display = 'none';
                    toggleBtn.classList.remove('hidden');
                    toggleBtn.title = '切换显示模式';
                    break;
                    
                case 1: // 只显示数据，隐藏皮肤背景
                    playerDetails.forEach(detail => {
                        detail.style.display = '';
                    });
                    // 隐藏皮肤背景
                    addHideSkinStyles();
                    
                    eyeIcon.style.display = 'block';
                    eyeOffIcon.style.display = 'none';
                    toggleBtn.title = '只显示数据';

                        const userId = this.getAttribute('data-user-id');
                        const roleId = this.getAttribute('data-role-id');
                        const roleName = this.getAttribute('data-role-name');
                        
                        console.log('点击玩家卡片:', { userId, roleId, roleName });
                        
                        // 检查roleId是否为0或空或无效值
                        if (!roleId || 
                            roleId === '0' ||

                            roleId === 'null' || 
                            roleId === 'undefined' ||
                            roleId.trim() === '') {
                            alert(`玩家 ${roleName || '未知玩家'} 营地未注册`);
                            return;

                            return;
                        }

                        const loadingText = this.getAttribute('data-loading-text') || '获取数据中...';
                        showModalLinkLoading(loadingText);
                        markPlayerCardLoading(this);
                        
                        // 跳转到指定URL
                        const urlParams = new URLSearchParams(window.location.search);
                        const currentKey = urlParams.get('key');
                        let targetUrl = `/jump-person?userid=${userId}&roleid=${roleId}`;
                        if (currentKey) {
                            targetUrl += `&key=${encodeURIComponent(currentKey)}`;
                        }

                        console.log('准备跳转到:', targetUrl);
                        const newTab = window.open(targetUrl, '_blank');

                        if (!newTab) {
                            hideModalLinkLoading();
                            releasePlayerCardLoading(this);
                            if (typeof showToast === 'function') {
                                showToast('弹窗被浏览器阻止，请允许打开新窗口查看详情', 'warning');
                            }
                            return;
                        }

                        setTimeout(() => {
                            hideModalLinkLoading();
                            releasePlayerCardLoading(this);
                        }, 1200);
                    };
                    
                    // 同时添加点击和触摸事件支持移动端
                    card.addEventListener('click', handleCardClick);
                    
                    // 移动端触摸事件处理 - 区分拖动和点击
                    let touchStartX, touchStartY, touchStartTime;
                    
                    card.addEventListener('touchstart', function(e) {
                        const touch = e.touches[0];
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                        touchStartTime = Date.now();
                    });
                    
                    card.addEventListener('touchend', function(e) {
                        e.preventDefault(); // 防止双重触发
                        
                        const touch = e.changedTouches[0];
                        const touchEndX = touch.clientX;
                        const touchEndY = touch.clientY;
                        const touchEndTime = Date.now();
                        
                        // 计算触摸移动距离和时间
                        const moveDistanceX = Math.abs(touchEndX - touchStartX);
                        const moveDistanceY = Math.abs(touchEndY - touchStartY);
                        const touchDuration = touchEndTime - touchStartTime;
                        
                        // 如果移动距离小于15px且触摸时间小于500ms，认为是点击而不是拖动
                        if (moveDistanceX < 15 && moveDistanceY < 15 && touchDuration < 500) {
                            handleCardClick.call(this);
                        }
                    });
                });
            }, 100);
        }

        // 页面加载完成后执行
        document.addEventListener('click', function(event) {
            const link = event.target.closest('.modal-overlay a[href]');
            if (!link) {
                return;
            }

            const href = link.getAttribute('href');
            if (!href || href.trim() === '' || href.startsWith('javascript:')) {
                return;
            }

            const modal = link.closest('.modal-overlay');
            if (link.dataset.loading === 'true' || (modal && modal.dataset.loading === 'true')) {
                event.preventDefault();
                return;
            }

            event.preventDefault();

            const loadingText = link.getAttribute('data-loading-text') || '正在跳转，请稍候...';
            showModalLinkLoading(loadingText);

            link.dataset.loading = 'true';
            link.classList.add('modal-link-disabled');
            link.setAttribute('aria-disabled', 'true');
            link.blur();

            if (modal) {
                modal.dataset.loading = 'true';
            }

            const target = (link.getAttribute('target') || '').toLowerCase();
            const rel = (link.getAttribute('rel') || '').toLowerCase();

            const performNavigation = () => {
                if (target && target !== '_self') {
                    const relValue = rel.includes('noopener') ? rel : (rel ? rel + ' noopener' : 'noopener');
                    link.setAttribute('rel', relValue.trim());
                    const opened = window.open(href, target);

                    if (!opened) {
                        hideModalLinkLoading();
                        resetModalLink(link);
                        if (modal) {
                            releaseModalLoadingState(modal);
                        }
                        return;
                    }

                    setTimeout(() => {
                        hideModalLinkLoading();
                        resetModalLink(link);
                        if (modal) {
                            releaseModalLoadingState(modal);
                        }
                    }, 800);
                } else {
                    window.location.assign(href);
                }
            };

            requestAnimationFrame(() => {
                requestAnimationFrame(performNavigation);
            });

            const timerId = setTimeout(() => {
                hideModalLinkLoading();
                resetModalLink(link);
                if (modal) {
                    releaseModalLoadingState(modal);
                }
            }, 12000);

            modalLinkTimers.set(link, timerId);
        }, true);

        window.addEventListener('pageshow', () => {
            hideModalLinkLoading();
            document.querySelectorAll('.modal-overlay[data-loading="true"]').forEach((modal) => {
                releaseModalLoadingState(modal);
            });
            document.querySelectorAll('.player-card[data-loading="true"]').forEach((card) => {
                releasePlayerCardLoading(card);
            });
        });

        window.addEventListener('pagehide', () => {
            hideModalLinkLoading();
            document.querySelectorAll('.player-card[data-loading="true"]').forEach((card) => {
                releasePlayerCardLoading(card);
            });
        });

        document.addEventListener('DOMContentLoaded', function() {
            setupBackButton();
            loadBattleData();
        });
    </script>
